spring.application.name=catalog-service
server.port=8081

# Database — override via environment variables in production
spring.datasource.url=${CATALOG_DB_URL:jdbc:h2:mem:catalogdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${CATALOG_DB_USER:sa}
spring.datasource.password=${CATALOG_DB_PASSWORD:}
spring.datasource.driver-class-name=${CATALOG_DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Jackson — serialize LocalDateTime as ISO-8601 string
spring.jackson.serialization.write-dates-as-timestamps=false
