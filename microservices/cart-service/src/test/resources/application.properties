# Cart Service — Test-Slice Configuration
# Used by @SpringBootTest and @DataJpaTest in src/test/.
# Keeps the same H2 in-memory configuration as main but with a distinct
# database name to isolate test data from any concurrent dev instance.

spring.datasource.url=jdbc:h2:mem:cartdb-test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable H2 console in tests
spring.h2.console.enabled=false
