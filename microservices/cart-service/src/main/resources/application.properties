# Cart Service — Application Configuration
# Spring Boot 2.6.4 / Java 11 / Phase 2.1 (dev/test profile)

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8081

# ── H2 In-Memory DataSource (BR-F-07) ─────────────────────────────────────────
# Named in-memory database (jdbc:h2:mem:cartdb) allows multiple connections
# within the same JVM (HikariCP pool). Data is ephemeral — dropped on shutdown.
spring.datasource.url=jdbc:h2:mem:cartdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop: DDL created at startup, dropped on shutdown (dev/test only — BR-F-06)
spring.jpa.hibernate.ddl-auto=create-drop
# Log generated SQL for development visibility (disable in production)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── H2 Console (dev convenience) ─────────────────────────────────────────────
# Accessible at http://localhost:8081/h2-console during local development.
# JDBC URL: jdbc:h2:mem:cartdb  User: sa  Password: (empty)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
